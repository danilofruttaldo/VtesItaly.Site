# Dependency updates. Pull requests run only the `ci` job of
# .github/workflows/deploy.yml: no Lighthouse, no deploy, no secrets.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # A release must be five days old before a PR is opened: time for a
    # compromised or broken version to be yanked first.
    cooldown:
      default-days: 5
    groups:
      # Minor and patch bumps land together in one PR a week. Majors keep
      # their own PR: they are the ones that break things (see the
      # TypeScript 7 note in the README).
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to 6.x on purpose: `astro check` does not run on 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ['*']
