name: CI

# Single workflow per commit: ci -> lighthouse -> deploy -> coverage badge.
# Lighthouse and deploy reuse the dist/ artifact uploaded by `ci`, so the
# whole build pipeline runs only once per push.
#
# Pull requests (including Dependabot's) run only the `ci` job: no Lighthouse,
# no deploy, no badge commit, and no access to the deploy secrets.
#
# Actions are pinned to a full commit SHA (a tag can be moved), with the
# version in a trailing comment; Dependabot (github-actions) updates both.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# No workflow-level concurrency on purpose: a workflow-level group with
# cancel-in-progress would also kill a deploy halfway through the tar
# extraction, leaving public_html with a mix of two releases. Each job
# declares its own group instead (see below).

jobs:
  ci:
    # Gate that runs on every push and PR: audit, lint, format, typecheck,
    # tests, build, integration smoke, site-wide checks, size guard.
    # Pinned instead of ubuntu-latest: the -latest label moves to a newer
    # image without notice, and the pipeline breaks for reasons unrelated
    # to the commit being tested.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      # A newer commit on the same ref supersedes the in-flight check.
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the badge job pushes: everywhere else the token is not left
          # in .git/config for later steps to read.
          persist-credentials: false
          # Full history: the build reads the `git log` dates of src/content
          # files (datePublished, dateModified, sitemap lastmod), and a
          # shallow clone would date every file to the last commit.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same major as `engines` in package.json; .nvmrc is the single
          # source for local tooling (nvm, fnm) and CI. setup-node caches
          # ~/.npm keyed on the lockfile, which is Node-version agnostic;
          # node_modules is never cached (npm ci rebuilds it).
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm audit --omit=dev

      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:coverage

      - name: Keep the coverage summary for the badge job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 1

      - run: npm run build
        env:
          NODE_ENV: production

      - run: npx vitest run --config vitest.integration.config.ts

      - name: Site-wide page checks on dist
        # Every built page: title, description, one h1, canonical, hreflang,
        # x-default, no em dash, CSP hashes for inline scripts, img alt.
        # Accepted cases are listed by name in the script.
        run: npm run check:pages

      - name: Internal link check on dist
        run: npm run check:links

      - name: Enforce dist size budget
        # Use apparent size (real bytes) instead of disk-allocated blocks: on
        # Linux ext4 the 4KB-block overhead across hundreds of small files adds
        # ~3MB that doesn't ship to the CDN. Matches the integration test's
        # statSync-based measurement (tests/integration/build-output.test.ts).
        run: |
          SIZE_MB=$(du --apparent-size -sm dist | cut -f1)
          echo "dist artifact: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 80 ]; then
            echo "::error::dist is ${SIZE_MB}MB, above the 80MB budget. Optimise images or split."
            exit 1
          fi

      - name: Upload dist artifact (shared with lighthouse + deploy)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          # Since upload-artifact 4.4 dotfiles are left out by default, and
          # dist/.htaccess is one: without this the release reached the server
          # without it (first release deploy, 2026-10-16, stopped by the check).
          include-hidden-files: true
          retention-days: 1

  lighthouse:
    # Lighthouse is a deploy gate, so it runs only where a deploy can follow.
    # Reuses the dist artifact from ci so a rerun doesn't redo lint/test/build.
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # 8 URLs x 3 runs x devtools throttling (~20-30s each) = 8-12 min.
    # Cushion for runner variance.
    timeout-minutes: 20
    concurrency:
      group: lighthouse-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download dist artifact from ci
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: .github/lighthouserc.json
          uploadArtifacts: true

  deploy:
    needs: [ci, lighthouse]
    # Only main reaches production. workflow_dispatch on another branch runs
    # ci and lighthouse but stops here.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: vtesitaly
      url: https://vtesitaly.com
    concurrency:
      # One deploy at a time, and never cancelled: killing the job while
      # tar is extracting would leave public_html half old, half new.
      # A newer run waits for this one to finish.
      group: deploy-vtesitaly-production
      cancel-in-progress: false
    steps:
      - name: Checkout (smoke test script only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
          sparse-checkout-cone-mode: true

      - name: Download dist artifact from ci
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Deploy a release and swap it in
        id: swap
        # Release directory deploy (docs/deploy-atomico.md, verified on the
        # hosting on 2026-10-16): the tarball is extracted into
        # ~/releases/<sha>, then public_html is swapped with two renames.
        # Nothing is ever written into the live directory, files removed from
        # the site disappear, and the previous release stays on disk for the
        # rollback below. .htaccess comes from the repo (public/.htaccess);
        # .well-known (AutoSSL challenges) is the only server-only file and is
        # copied over. Matomo (~/stats.vtesitaly.com) and gp2025 live outside
        # public_html and are not touched.
        # Trade-off vs lftp: no delta, uploads everything each run. Accepted
        # because shared hosting throttles parallel SFTP, and Astro's content
        # hashes mean most files change anyway on rebuild.
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          set -euo pipefail

          # The host key is pinned from the environment secret, never learnt
          # at runtime: an ssh-keyscan fallback would trust whoever answers
          # on the first connection. Generate it locally with
          # `ssh-keyscan -p $PORT $HOST` and store it as SSH_KNOWN_HOSTS.
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS secret is not set on the vtesitaly environment. Refusing to deploy without a pinned host key."
            exit 1
          fi
          for v in SSH_KEY SSH_USER SSH_HOST SSH_PORT; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set on the vtesitaly environment."
              exit 1
            fi
          done

          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          SSH_OPTS=(-i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          REMOTE="$SSH_USER@$SSH_HOST"

          # 1. Upload into a fresh release directory. Directories named after a
          # commit are only ever in-flight uploads: one still there is left
          # over from a run that stopped before the swap, so it goes (prev-*
          # and fallita-* are kept).
          tar -C dist -cz . | ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "set -e; mkdir -p ~/releases; find ~/releases -mindepth 1 -maxdepth 1 -type d -regextype posix-extended -regex '.*/[0-9a-f]{40}' -exec rm -rf {} +; mkdir -p ~/releases/$GITHUB_SHA; tar -C ~/releases/$GITHUB_SHA -xz"

          # 2. Swap it in. The two renames leave public_html missing for a few
          # microseconds, far less than the in-place extraction this replaces.
          ssh "${SSH_OPTS[@]}" "$REMOTE" bash -s -- "$GITHUB_SHA" <<'REMOTE_SCRIPT'
          set -euo pipefail
          SHA=$1
          NEW=~/releases/$SHA
          [ -f "$NEW/index.html" ] || { echo "Release incompleta: manca index.html"; exit 1; }
          [ -f "$NEW/.htaccess" ] || { echo "Release incompleta: manca .htaccess"; exit 1; }
          if [ -d ~/public_html/.well-known ]; then
            cp -a ~/public_html/.well-known "$NEW/"
          fi
          # Hashed files of the live release (Astro chunks, Pagefind index and
          # fragments) stay for one more release: a tab opened before this
          # deploy can still load its chunks and run a search. Only the files
          # the live release shipped itself are carried, so they don't pile up.
          # ~/releases/.asset-list is the list of the live release; each prev-*
          # keeps its own next to it (prev-*.assets, outside the web root), so a
          # rollback can put the right one back. Hard links where possible (same
          # filesystem, no extra disk), a plain copy otherwise.
          (cd "$NEW" && find _astro pagefind -type f 2>/dev/null || true) > ~/releases/.asset-list.new
          if [ -f ~/releases/.asset-list ]; then
            (cd ~/public_html && while IFS= read -r f; do
              if [ -f "$f" ] && [ ! -e "$NEW/$f" ]; then
                cp -pl --parents "$f" "$NEW/" 2>/dev/null || cp -p --parents "$f" "$NEW/"
              fi
            done < ~/releases/.asset-list)
          fi
          chmod 755 "$NEW"
          PREV=~/releases/prev-$(date -u +%Y%m%d%H%M%S)
          mv ~/public_html "$PREV"
          if ! mv "$NEW" ~/public_html; then
            # Never leave the site without a document root.
            mv "$PREV" ~/public_html
            echo "Scambio fallito: rimessa la release precedente."
            exit 1
          fi
          # Marker tied to this commit: the rollback acts only on its own swap.
          echo "$SHA $PREV" > ~/releases/.ultima-precedente
          # The list follows its release: the old one goes with $PREV, the new
          # one becomes the live list.
          if [ -f ~/releases/.asset-list ]; then
            mv ~/releases/.asset-list "$PREV.assets"
          fi
          mv ~/releases/.asset-list.new ~/releases/.asset-list
          # Keep the five most recent previous releases (directories only: the
          # trailing slash leaves the prev-*.assets lists out of the glob).
          { ls -1dt ~/releases/prev-*/ 2>/dev/null || true; } | tail -n +6 | xargs -r rm -rf
          # Keep the two most recent releases removed by a rollback: enough to
          # inspect what went wrong, without filling the disk over time.
          { ls -1dt ~/releases/fallita-*/ 2>/dev/null || true; } | tail -n +3 | xargs -r rm -rf
          # Lists whose release directory is gone.
          for a in ~/releases/*.assets; do
            if [ -f "$a" ] && [ ! -d "${a%.assets}" ]; then rm -f "$a"; fi
          done
          echo "Pubblicata $SHA, precedente in $PREV"
          REMOTE_SCRIPT

      - name: Smoke test production
        id: smoke
        # Runs from the runner, i.e. from outside the hosting: catches DNS,
        # firewall and missing-section problems that a check on the server
        # itself would not see. The script bounds itself (about 3 minutes);
        # the step timeout is the last guard, and a timeout counts as a
        # failure, so the rollback below runs.
        timeout-minutes: 5
        run: bash scripts/smoke-test.sh https://vtesitaly.com

      - name: Confirm the release
        # Smoke test passed: the marker is no longer needed. A failure here
        # must not roll back a release that passed the smoke test: a leftover
        # marker is harmless, the next deploy overwrites it and the rollback
        # acts only when the sha in it matches its own run.
        continue-on-error: true
        env:
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "rm -f ~/releases/.ultima-precedente"

      - name: Roll back to the previous release
        # Only when the swap or the smoke test failed (a smoke timeout counts),
        # or the run was cancelled in between: puts the previous public_html
        # back and keeps the broken one aside for inspection. Not on a failure
        # of the confirm step, which runs only after a passed smoke test. The
        # marker check below decides whether a swap of this run really
        # happened.
        if: always() && (steps.swap.outcome == 'failure' || steps.smoke.outcome == 'failure' || cancelled())
        env:
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          set -euo pipefail
          [ -f ~/.ssh/deploy_key ] || { echo "Nessuna chiave: il deploy non era partito."; exit 0; }
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" bash -s -- "$GITHUB_SHA" <<'REMOTE_SCRIPT'
          set -euo pipefail
          [ -f ~/releases/.ultima-precedente ] || { echo "Nessuna release precedente registrata: niente da ripristinare."; exit 0; }
          read -r SHA PREV < ~/releases/.ultima-precedente
          # A marker from an earlier, successful run must never be undone: if the
          # swap of this run did not happen, the live site is the good one.
          [ "$SHA" = "$1" ] || { echo "Lo scambio di questo giro non e' avvenuto: niente da ripristinare."; exit 0; }
          [ -d "$PREV" ] || { echo "La release precedente $PREV non c'e' piu'."; exit 1; }
          mv ~/public_html ~/releases/"fallita-$(date -u +%Y%m%d%H%M%S)"
          mv "$PREV" ~/public_html
          # The asset list goes back with its release: the next deploy carries
          # the hashed files of the restored release, not of the broken one.
          rm -f ~/releases/.asset-list
          if [ -f "$PREV.assets" ]; then
            mv "$PREV.assets" ~/releases/.asset-list
          fi
          rm -f ~/releases/.ultima-precedente
          echo "Ripristinata $PREV"
          REMOTE_SCRIPT

  gcal-sync:
    # Pushes the calendar of the release just deployed to the public Google
    # calendar (scripts/sync-gcal.mjs). Its own job: the site is already live,
    # so a Google failure shows red here without touching the deploy or its
    # rollback. Skipped with a warning while the secrets are not set.
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: vtesitaly
    concurrency:
      # Never two syncs writing at once; the newer run waits and then wins.
      group: gcal-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            src/utils
            src/i18n
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node >= 22.18 runs the .ts import of the script (type stripping).
          node-version-file: .nvmrc

      - name: Download dist artifact from ci
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Sync Google Calendar
        env:
          GCAL_CREDENTIALS: ${{ secrets.GCAL_CREDENTIALS }}
          # Set to 1 only for one intended mass cleanup (see removalLimit).
          GCAL_ALLOW_REMOVALS: ${{ vars.GCAL_ALLOW_REMOVALS }}
        run: node scripts/sync-gcal.mjs

  coverage-badge:
    # Refreshes `.github/coverage-badge.json` (read by the README badge via
    # shields.io) after a successful deploy. Kept out of `ci` so a badge
    # commit can never block or fail the gate, and serialised so two runs
    # never push at the same time.
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write # push the badge commit back to main
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tip of main, not the commit that triggered the run: if main
          # moved in the meantime the push would be rejected as non-fast-forward.
          ref: main

      - name: Download coverage summary from ci
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-summary
          path: coverage

      - name: Commit the badge only when the value changes
        run: |
          node scripts/coverage-badge.mjs
          if [ -z "$(git status --porcelain .github/coverage-badge.json)" ]; then
            echo "Coverage badge unchanged, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/coverage-badge.json
          git commit -m "chore(site): refresh coverage badge [skip ci]"
          # One retry if main moved between checkout and push.
          git push || { git pull --rebase origin main && git push; }
